name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Check out the attestation awaiter
        uses: actions/checkout@v6
        with:
          # This job judges a PR body, never repository state, so it needs no
          # git credentials in the checkout it runs the awaiter from.
          persist-credentials: false
      - name: Await the pipeline attestation for the current PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin/fm-pr-attestation-await.sh \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ github.event.pull_request.number }}"
      - name: Verify no-mistakes signature and pipeline attestation
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@32d396ac0f29135daf7fcb9964aba9d5f4e796d6 # post-v1.57.1, untagged (action added in #819)
        with:
          # Judge the live pull request, not the event payload snapshot. The
          # pipeline pushes the commit and re-signs the body moments later, so
          # the synchronize payload can carry the previous head's attestation
          # for a PR that is already compliant. These stay empty when the
          # awaiter could not read the PR, and the action falls back to the
          # payload on its own.
          pr-body: ${{ steps.pr.outputs.body }}
          pr-head-sha: ${{ steps.pr.outputs.head-sha }}
          pr-head-ref: ${{ steps.pr.outputs.head-ref }}
          pr-author: ${{ steps.pr.outputs.author }}
          pr-number: ${{ github.event.pull_request.number }}
          exempt-bot-authors: false
